name: Release Pygls to PyPI

on:
  release:
    types: [published]

jobs:
  release:
    name: "🚀 Release 🚢"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{secrets.CI_RELEASE_DEPLOY_KEY}}
          fetch-depth: 0
          persist-credentials: true  # needed to push commits to main

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  #v10.2.0
        with:
          version: "0.12.10"
          enable-cache: false
          cache-dependency-glob: "uv.lock"

      - name: Generate the latest changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest
        env:
          OUTPUT: git-cliff-changes.tmp.md

      - name: Update the changelog
        run: |
          git checkout main
          cat git-cliff-changes.tmp.md | sed -i "3r /dev/stdin" CHANGELOG.md
          git config --global user.name 'Github Action'
          git config --global user.email 'github.action@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md"
          git push

      - name: Update CONTRIBUTORS.md
        run: |
          git checkout main
          uv run poe generate_contributors_md
          if [[ $(git diff --stat CONTRIBUTORS.md) != '' ]]; then
            git add CONTRIBUTORS.md
            git commit -m "chore: update CONTRIBUTORS.md"
            git push
          fi

      - name: Release
        run: |
          uv build
          uvx poetry publish --username "__token__" --password ${{ secrets.PYPI_API_TOKEN }}
